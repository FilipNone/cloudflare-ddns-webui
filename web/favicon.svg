<svg viewBox="0 0 222 106" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Flat base with rounded bottom corners; the domes are trimmed to it -->
    <clipPath id="base"><path d="M6 0H216V90A10 10 0 0 1 206 100H16A10 10 0 0 1 6 90Z"/></clipPath>
    <!-- White keeps the cloud; the black diagonal cuts the gap between the two parts -->
    <mask id="split">
      <g fill="white" clip-path="url(#base)">
        <circle cx="27" cy="82" r="21"/>
        <circle cx="58" cy="54" r="23"/>
        <circle cx="118" cy="56" r="48"/>
        <circle cx="180" cy="82" r="36"/>
        <path d="M6 82L58 54L118 56L180 82H216V106H6Z"/>
      </g>
      <line x1="180.4" y1="0" x2="147" y2="110" stroke="black" stroke-width="3.5"/>
    </mask>
  </defs>
  <g mask="url(#split)">
    <path d="M0 0H180.4L147 110H0Z" fill="#F8BD1A"/>
    <path d="M180.4 0H222V110H147Z" fill="#F56B3B"/>
  </g>
</svg>
