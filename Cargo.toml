[package]
name = "cloudflare-ddns-webui"
version = "1.1.0"
edition = "2021"
description = "A lightweight, fast web GUI for Cloudflare DDNS - manage DNS records, zones and DDNS updates"
license = "GPL-3.0"

[dependencies]
qrcodegen = "1.8"
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", features = ["ring"], default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal", "net", "io-util", "fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
